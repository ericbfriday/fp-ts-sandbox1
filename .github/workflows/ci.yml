# CI per ADR-0004: install (frozen) -> lint (packages + examples), typecheck matrix (root +
# examples/next-app incl. its tests), test, then build -> size-limit -> dist smokes (ADR-0002;
# every package but next) -> source-condition smoke (ADR-0002, #63; every package but next) ->
# `next build` of the example. `pnpm run ci` runs the same gates locally (typecheck on TS 7
# only; the tRPC peer-floor job is CI-only).
# Publishing is intentionally absent: never publish to npm from CI without Eric.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm/action-setup@v4 reads the pnpm version from package.json#packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # oxlint (type-aware, needs TS 7 via tsgolint) + local ESLint plugin + dprint check.
      - run: pnpm run lint

  typecheck:
    name: typecheck (TypeScript ${{ matrix.ts.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matrix approach: install the frozen lockfile (pins TS 7.0), then swap the root
        # `typescript` devDependency for an npm alias of the target version, e.g.
        #   pnpm add -D -w typescript@npm:typescript@~6.0.3
        # Everything that runs `tsc` (pnpm run check, vitest --typecheck) then resolves
        # that version. The lockfile change is throwaway and never committed.
        # tooling/eslint-plugin keeps its own pinned typescript ~6.0 and is unaffected.
        # The empty spec means "use the lockfile version" (7.0.x, the repo default).
        ts:
          - { name: "6.0", spec: "~6.0.3" }
          - { name: "7.0", spec: "" }
          - { name: "7.1-beta", spec: "7.1.0-beta" }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install typescript@${{ matrix.ts.spec }} as npm alias
        if: matrix.ts.spec != ''
        run: pnpm add -D -w "typescript@npm:typescript@${{ matrix.ts.spec }}"
      - run: pnpm exec tsc --version
      # `check` ends with the type-instantiation budget (tooling/type-budget, #61), which reads
      # the ceiling recorded for this TypeScript major.minor.
      - run: pnpm run check
      - run: pnpm run test:types

  trpc-floor:
    # #57: @friday-friday/trpc's peer range is `^11`, so its types must hold on the oldest
    # 11.x. Same throwaway-swap approach as the TypeScript matrix: install the frozen
    # lockfile, then pin the tRPC devDependencies to the floor (never committed).
    name: tRPC peer floor (11.0.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D --filter @friday-friday/trpc @trpc/server@11.0.0 @trpc/client@11.0.0
      - run: pnpm run check
      # Runtime + type tests for the trpc package only.
      - run: pnpm exec vitest run packages/trpc

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  size:
    name: build + size-limit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `size` builds every package with tsdown first, then checks ADR-0004 budgets.
      - run: pnpm run size
      # ADR-0002 gate: the built dist output must run under plain Node 24.
      - run: pnpm run smoke
      # ADR-0002 gate (#63): every package entry also loads from src under plain Node 24 with
      # --conditions=@friday-friday/source (type stripping, no loader) and matches dist's exports.
      - run: pnpm run smoke:source
      # Phase 1 exit criterion: the example app builds under Next (offline; resolves package dist).
      - run: pnpm run build:examples
        env:
          NEXT_TELEMETRY_DISABLED: "1"
